name: Deploy to Yandex Object Storage

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync site to bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
        run: |
          aws s3 sync . "s3://${YC_BUCKET}" \
            --endpoint-url https://storage.yandexcloud.net \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude "AGENTS.md" \
            --exclude "CLAUDE.md"

          # aws s3 sync guesses "text/html" with no charset for .html files;
          # force the correct content-type explicitly so it doesn't rely on
          # the in-document <meta charset> alone.
          aws s3 cp index.html "s3://${YC_BUCKET}/index.html" \
            --endpoint-url https://storage.yandexcloud.net \
            --content-type "text/html; charset=utf-8"
